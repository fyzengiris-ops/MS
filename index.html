<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a8a5c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>面试复习 · AI产品经理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=mock2-2" />
</head>
<body>
  <div class="app" id="appShell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <p class="brand-kicker">本地复习</p>
          <h1 class="brand-title">面试题库</h1>
          <p class="brand-sub" id="metaSub">按模块记忆回答维度</p>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebarCollapse" title="收起目录" aria-label="收起目录">«</button>
      </div>

      <label class="search-wrap">
        <span class="sr-only">搜索问题</span>
        <input id="searchInput" type="search" placeholder="搜索问题关键词…" autocomplete="off" />
      </label>

      <nav class="cat-nav" id="catNav" aria-label="分类"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="sidebar-toggle open-only" id="sidebarExpand" title="展开目录" aria-label="展开目录">目录</button>
          <h2 class="view-title" id="viewTitle">选择一个问题开始</h2>
        </div>
      </header>

      <section class="question-list" id="questionList"></section>
    </main>
  </div>

  <script src="data/questions.js?v=mock2-2"></script>
  <script src="js/mock-interview.js?v=mock2-2"></script>
  <script src="js/app.js?v=mock2-2"></script>
</body>
</html>
